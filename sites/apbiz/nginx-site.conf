# The nginx inside the apbiz-site container: static files only. Parcelbox's nginx in front of it handles HTTPS, the www redirect and compression.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect /services/gst to /services/gst/ without writing this container's own host name into the address.
    absolute_redirect off;
    error_page 404 /404.html;

    location / { try_files $uri $uri/ =404; }
    location ~* \.(css|svg)$ { expires 1h; }
    location = /404.html { internal; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
}
